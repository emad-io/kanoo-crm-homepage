<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanoo Logistics commercial control tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://live.gadgets.zoho.com/api/v1.2/ZohoEmbededAppSDK.min.js"></script>
<style>
:root{
  --navy:#0A4875;        /* sampled from the Kanoo logo */
  --deep:#06304F;
  --tide:#2F7FB3;
  --gold:#B8862B;        /* date-palm gold, used only for the route line */
  --page:#F3F6F9;
  --surface:#FFFFFF;
  --ink:#0E2A40;
  --muted:#5C7386;
  --rule:#DCE4EB;
  --soft:#EAF1F6;
  --ok:#1C8556; --warn:#B56A0B; --bad:#B93A2B;
  --okbg:#E4F3EC; --warnbg:#FBEFD9; --badbg:#FBE6E2;
  --logo-filter:none; --onbar:#fff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --navy:#7FB8E0; --deep:#0A4875; --tide:#5AA5D6; --gold:#D9A94A;
    --page:#071B2B; --surface:#0C283D; --ink:#E8F0F6; --muted:#93A9BA;
    --rule:#1B3D56; --soft:#123249;
    --ok:#56C596; --warn:#E8AE4F; --bad:#F08A7B;
    --okbg:#0F3A2C; --warnbg:#3D2E10; --badbg:#44201B;
    --logo-filter:brightness(0) invert(1); --onbar:#06304F;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--page); color:var(--ink);
  font-family:"Readex Pro","Segoe UI",Tahoma,Arial,sans-serif;
  font-size:14px; line-height:1.45; font-weight:400;
  font-variant-numeric:tabular-nums;
}
.wrap{max-width:1320px; margin:0 auto; padding:18px 20px 28px}
h1,h2,p{margin:0}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--tide); outline-offset:2px}

/* header */
.top{display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding-bottom:16px; border-bottom:1px solid var(--rule)}
.top img{height:52px; width:auto; display:block; filter:var(--logo-filter)}
.top .ttl{flex:1 1 220px; min-width:200px; padding-inline-start:18px; border-inline-start:1px solid var(--rule)}
.top h1{font-size:19px; font-weight:600; letter-spacing:-.01em; color:var(--navy)}
.top .sub{color:var(--muted); font-size:13px}
.seg{display:inline-flex; background:var(--soft); border-radius:8px; padding:3px}
.seg button{border:0; background:transparent; padding:6px 11px; border-radius:6px; cursor:pointer; font-size:13px; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--navy); font-weight:500; box-shadow:0 1px 2px rgba(10,72,117,.18)}
.src{font-size:12px; padding:5px 10px; border-radius:20px; background:var(--soft); color:var(--muted); white-space:nowrap}
.src.live{background:var(--okbg); color:var(--ok)}

/* KPI band */
.kpis{display:grid; grid-template-columns:repeat(5,1fr); margin-top:18px; background:var(--surface); border:1px solid var(--rule); border-radius:10px}
.kpi{padding:16px 18px; border-inline-start:1px solid var(--rule)}
.kpi:first-child{border-inline-start:0}
.kpi .lab{font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:6px}
.kpi .val{font-size:30px; font-weight:300; letter-spacing:-.02em; color:var(--navy); line-height:1.15; margin-top:4px}
.kpi .val small{font-size:14px; font-weight:400; color:var(--muted); margin-right:4px}
.kpi .val bdi{display:inline-block}
.kpi .note{font-size:12px; margin-top:2px}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--muted)}
.dot{width:7px; height:7px; border-radius:50%; background:var(--ok); display:none}
.is-live .dot{display:inline-block}

/* route */
.route{margin-top:18px; background:var(--deep); color:#fff; border-radius:10px; padding:20px 22px 22px; overflow-x:auto}
@media (prefers-color-scheme:dark){.route{background:#0A3A5E}}
.route h2{font-size:15px; font-weight:500; color:#fff}
.route .hint{font-size:12.5px; color:#B8D2E4}
.stops{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(118px,1fr); margin-top:20px; min-width:700px; position:relative}
.stop{position:relative; padding-top:26px}
.stop::before{content:""; position:absolute; top:6px; inset-inline:0; height:2px; background:#D9A94A; opacity:.85}
.stop:first-child::before{inset-inline-start:7px}
.stop:last-child::before{inset-inline-end:calc(100% - 7px)}
.stop::after{content:""; position:absolute; top:0; inset-inline-start:0; width:14px; height:14px; border-radius:50%; background:var(--deep); border:2px solid #D9A94A}
@media (prefers-color-scheme:dark){.stop::after{background:#0A3A5E}}
.stop.end::after{background:#D9A94A}
.stop .n{font-size:28px; font-weight:300; line-height:1.1}
.stop .nm{font-size:13px; color:#DCEAF4; margin-top:2px}
.stop .v{font-size:12.5px; color:#B8D2E4}
.stop .cv{position:absolute; top:-3px; inset-inline-start:26px; font-size:11.5px; color:#F1D38E; background:var(--deep); padding:0 6px}
@media (prefers-color-scheme:dark){.stop .cv{background:#0A3A5E}}

/* panels */
.grid{display:grid; grid-template-columns:repeat(12,1fr); gap:18px; margin-top:18px}
.panel{background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:18px 18px 16px; min-width:0}
.c7{grid-column:span 7} .c5{grid-column:span 5} .c4{grid-column:span 4}
.panel h2{font-size:15px; font-weight:600; color:var(--navy)}
.panel .hint{font-size:12.5px; color:var(--muted); margin-top:1px}
.head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:12px}
.badge{font-size:12px; padding:3px 9px; border-radius:20px; white-space:nowrap}
.b-bad{background:var(--badbg); color:var(--bad)} .b-warn{background:var(--warnbg); color:var(--warn)} .b-ok{background:var(--okbg); color:var(--ok)}
.empty{color:var(--muted); font-size:13px; padding:14px 0}

table{width:100%; border-collapse:collapse}
th{font-size:12px; font-weight:400; color:var(--muted); text-align:start; padding:0 8px 6px 0; border-bottom:1px solid var(--rule)}
td{padding:10px 8px 10px 0; border-bottom:1px solid var(--rule); vertical-align:top; font-size:13.5px}
[dir=rtl] th,[dir=rtl] td{padding:0 0 6px 8px} [dir=rtl] td{padding:10px 0 10px 8px}
tr:last-child td{border-bottom:0}
td .s{display:block; font-size:12px; color:var(--muted)}
.num{text-align:end; white-space:nowrap}
.tblwrap{overflow-x:auto}

.warnlist{list-style:none; margin:0; padding:0}
.warnlist li{display:grid; grid-template-columns:46px 1fr; gap:12px; padding:10px 0; border-bottom:1px solid var(--rule)}
.warnlist li:last-child{border-bottom:0}
.ring{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-size:13px; font-weight:500;
  background:conic-gradient(var(--rc) calc(var(--p)*1%), var(--soft) 0)}
.ring span{width:34px; height:34px; border-radius:50%; background:var(--surface); display:grid; place-items:center}
.warnlist b{font-weight:500}
.warnlist .s{font-size:12.5px; color:var(--muted)}

.bars{display:grid; gap:11px}
.bar .row{display:flex; justify-content:space-between; gap:10px; font-size:13px}
.bar .row span:last-child{white-space:nowrap}
.track{position:relative; height:8px; background:var(--soft); border-radius:4px; margin-top:5px}
.fill{position:absolute; inset-block:0; inset-inline-start:0; border-radius:4px; background:var(--tide)}
.fill.low{background:var(--bad)}
.tick{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink)}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:12px}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-inline-end:5px; vertical-align:-1px}
svg text{font-family:inherit; font-size:11px; fill:var(--muted)}

.renew{display:grid; grid-template-columns:repeat(3,1fr); gap:0; margin-top:4px}
.renew>div{padding:4px 12px; border-inline-start:1px solid var(--rule)}
.renew>div:first-child{border-inline-start:0; padding-inline-start:0}
.renew .n{font-size:24px; font-weight:300; color:var(--navy)}
.renew .s{font-size:12.5px; color:var(--muted)}
.sep{height:1px; background:var(--rule); margin:14px 0}

.foot{margin-top:16px; font-size:12px; color:var(--muted); display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.foot .dot{display:inline-block}

@media (max-width:1040px){ .c7,.c5,.c4{grid-column:span 12} .kpis{grid-template-columns:repeat(3,1fr)} .kpi:nth-child(4){border-inline-start:0} .kpi:nth-child(n+4){border-top:1px solid var(--rule)} }
@media (max-width:620px){ .kpis{grid-template-columns:1fr 1fr} .kpi{border-inline-start:0; border-top:1px solid var(--rule)} .kpi:nth-child(-n+2){border-top:0} .kpi:nth-child(even){border-inline-start:1px solid var(--rule)} .top .ttl{border:0; padding:0} }
</style>
</head>

 {c:"UAE",cust:"Emirates Gulf Retail LLC",h:58,en:"Contract ends in 27 days with no renewal quote issued",ar:"ينتهي العقد خلال 27 يومًا دون إصدار عرض تجديد"},
 {c:"BH",cust:"Manama Trading and Logistics WLL",h:63,en:"Volume down 22% month on month, 2 complaints in 60 days",ar:"انخفاض الحجم 22% عن الشهر السابق، شكويان خلال 60 يومًا"},
 {c:"OM",cust:"Muscat Fresh Produce",h:66,en:"Days sales outstanding has risen to 71",ar:"ارتفع متوسط فترة التحصيل إلى 71 يومًا"}];
const LANES=[
 {c:"KSA",en:"Frankfurt to Riyadh, air",ar:"فرانكفورت إلى الرياض، جوي",m:21.3,min:18},
 {c:"KSA",en:"Jeddah to Riyadh, reefer",ar:"جدة إلى الرياض، مبرّد",m:18.4,min:15},
 {c:"KSA",en:"Dammam to Riyadh, curtain-side",ar:"الدمام إلى الرياض، ستارة جانبية",m:16.9,min:14},
 {c:"KSA",en:"Shanghai to Jeddah, FCL",ar:"شنغهاي إلى جدة، حاوية كاملة",m:14.2,min:12},
 {c:"BH",en:"Bahrain to Dammam, flatbed",ar:"البحرين إلى الدمام، سطحة",m:13.2,min:14},
 {c:"UAE",en:"Dubai to Riyadh, cross-border",ar:"دبي إلى الرياض، عبر الحدود",m:11.6,min:14},
 {c:"OM",en:"Sohar to Jeddah, FCL",ar:"صحار إلى جدة، حاوية كاملة",m:15.8,min:16}];
const FORECAST=[[5.1,4.9],[5.4,5.6],[5.2,5.0],[5.9,5.7],[6.3,6.6],[6.8,2.4]];
const RENEW=[[3,2.1e6],[5,3.8e6],[9,6.4e6]];
const COMPLAINTS=[14,9,8,7,6,5];
const LOST=[38,19,14,13,9,7];

/* ---------- state ---------- */
const S={c:"ALL",lang:"en",live:null,t0:Date.now()};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const sar=n=>n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?Math.round(n/1e3)+"K":String(Math.round(n));
const inC=r=>S.c==="ALL"||r.c===S.c;
const scale=n=>Math.max(1,Math.round(n*SHARE[S.c]));

function sampleKpi(){
  if(S.c!=="ALL")return KPI[S.c];
  const ks=Object.values(KPI),tot=ks.reduce((a,k)=>a+k.pipe,0),w=f=>ks.reduce((a,k)=>a+k[f]*k.pipe,0)/tot;
  return {pipe:tot,win:Math.round(w("win")),qt:+w("qt").toFixed(1),mg:+w("mg").toFixed(1)};
}

function render(){
  const L=T[S.lang],k=sampleKpi(),lv=S.live;
  document.documentElement.lang=S.lang; document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=L[e.dataset.t]);
  $("today").textContent=new Date().toLocaleDateString(S.lang==="ar"?"ar-SA-u-ca-gregory-nu-latn":"en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  $("countries").innerHTML=["ALL","KSA","BH","UAE","OM"].map(c=>`<button data-c="${c}" aria-pressed="${S.c===c}">${c==="ALL"?L.all:L[c]}</button>`).join("");
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===S.lang));
  $("src").textContent=lv?L.live:L.sample; $("src").className="src"+(lv?" live":"");

  /* KPIs: first three switch to live CRM figures when the widget runs inside Zoho CRM */
  const pipe=lv?lv.pipe:k.pipe, wtd=lv?lv.weighted:k.pipe*.42, win=lv?lv.win:k.win;
  const pct=pipe?Math.round(wtd/pipe*100):0;
  const cards=[
   [L.k1,`<bdi dir="ltr"><small>SAR</small>${sar(pipe)}</bdi>`,lv?`${lv.open} ${L.deals}`:L.k1n,lv?"flat":"up",!!lv],
   [L.k2,`<bdi dir="ltr"><small>SAR</small>${sar(wtd)}</bdi>`,`${pct}% ${L.k2n}`,"flat",!!lv],
   [L.k3,win==null?"n/a":`${win}%`,lv?"":L.k3n,"up",!!lv],
   [L.k4,`${k.qt}<small style="margin:0 5px">${L.hrs}</small>`,L.k4n,k.qt<=8?"up":"down",false],
   [L.k5,`${k.mg}%`,L.k5n,k.mg>=14?"up":"down",false]];
  $("kpis").innerHTML=cards.map(c=>`<div class="kpi${c[4]?" is-live":""}"><div class="lab"><span class="dot"></span>${c[0]}</div><div class="val">${c[1]}</div><div class="note ${c[3]}">${c[2]}</div></div>`).join("");

  /* route */
  let stops;
  if(lv&&lv.stages.length){ stops=[[L.st[0],lv.leads,0],...lv.stages.map(s=>[s.name,s.n,s.v])]; }
  else stops=STAGES.map((s,i)=>[L.st[i],scale(s[0]),s[1]*SHARE[S.c]]);
  $("stops").innerHTML=stops.map((s,i)=>{
    const prev=i?parseInt(stops[i-1][1]):0, cv=i&&prev?Math.round(parseInt(s[1])/prev*100):null;
    return `<div class="stop${i===stops.length-1?" end":""}">${cv!=null&&cv<=100?`<span class="cv">${cv}%</span>`:""}<div class="n">${s[1]}</div><div class="nm">${esc(s[0])}</div><div class="v">${s[2]?"SAR "+sar(s[2]):"&nbsp;"}</div></div>`;}).join("");

  /* approvals */
  const el=(Date.now()-S.t0)/60000, ap=APPROVALS.filter(inC);
  $("apCount").textContent=`${ap.length} ${L.waiting}`; $("apCount").style.display=ap.length?"":"none";
  $("approvals").innerHTML=ap.length?`<table><thead><tr>${L.apCols.map((c,i)=>`<th${i&&i<3||i===4?' class="num"':""}>${c}</th>`).join("")}</tr></thead><tbody>${ap.map(a=>{
    const left=Math.round(a.mins-el),ab=Math.abs(left),tm=`${Math.floor(ab/60)}h ${String(ab%60).padStart(2,"0")}m`;
    return `<tr><td>${esc(a.cust)}<span class="s">${esc(a.lane)}, SAR ${sar(a.val)}</span></td><td class="num down">${a.m}%</td><td class="num">${a.min}%</td><td>${esc(a.who)}</td><td class="num">${left<0?`<span class="badge b-bad">${L.overdue} ${tm}</span>`:left<180?`<span class="badge b-warn">${tm}</span>`:tm}</td></tr>`;}).join("")}</tbody></table>`:`<div class="empty">${L.apEmpty}</div>`;

  /* warnings */
  const ws=WARN.filter(inC);
  $("warnings").innerHTML=ws.length?ws.map(w=>`<li><div class="ring" style="--p:${w.h};--rc:var(${w.h<50?"--bad":"--warn"})"><span>${w.h}</span></div><div><b>${esc(w.cust)}</b><div class="s">${w[S.lang]}</div></div></li>`).join(""):`<li class="empty" style="display:block">${L.ewEmpty}</li>`;

  /* margins */
  $("margins").innerHTML=LANES.filter(inC).map(l=>`<div class="bar"><div class="row"><span>${l[S.lang]}</span><span class="${l.m<l.min?"down":""}">${l.m}%</span></div><div class="track"><div class="fill${l.m<l.min?" low":""}" style="width:${l.m/25*100}%"></div><div class="tick" style="inset-inline-start:${l.min/25*100}%"></div></div></div>`).join("");

  /* forecast chart */
  const W=320,H=150,pad=22,bw=26,gap=(W-pad*2-bw*6)/5,f=SHARE[S.c],mx=7.5*f,y=v=>H-24-(v*f/mx)*(H-44);
  const xs=FORECAST.map((_,i)=>pad+i*(bw+gap));
  $("forecast").innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${L.fcTitle}" style="direction:ltr">
   <line x1="${pad-8}" x2="${W-pad+8}" y1="${H-24}" y2="${H-24}" stroke="var(--rule)"/>
   ${FORECAST.map((d,i)=>`<rect x="${xs[i]}" y="${y(d[1])}" width="${bw}" height="${H-24-y(d[1])}" rx="3" fill="var(--tide)" opacity="${i===5?.45:1}"/><text x="${xs[i]+bw/2}" y="${y(d[1])+14}" text-anchor="middle" style="fill:var(--onbar);font-weight:500">${(d[1]*f).toFixed(1)}</text><text x="${xs[i]+bw/2}" y="${H-8}" text-anchor="middle">${L.months[i]}</text>`).join("")}
   <polyline fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${FORECAST.map((d,i)=>`${xs[i]+bw/2},${y(d[0])}`).join(" ")}"/>
   ${FORECAST.map((d,i)=>`<circle cx="${xs[i]+bw/2}" cy="${y(d[0])}" r="3" fill="var(--surface)" stroke="var(--gold)" stroke-width="2"/>`).join("")}</svg>`;

  $("renewals").innerHTML=RENEW.map((r,i)=>`<div><div class="n">${scale(r[0])}</div><div class="s">${L["d"+(i+1)*30]}<br>SAR ${sar(r[1]*SHARE[S.c])}</div></div>`).join("");

  $("sla").textContent=`87% ${L.sla}`;
  const cm=Math.max(...COMPLAINTS);
  $("complaints").innerHTML=COMPLAINTS.map((n,i)=>`<div class="bar"><div class="row"><span>${L.cats[i]}</span><span>${scale(n)}</span></div><div class="track"><div class="fill" style="width:${n/cm*100}%"></div></div></div>`).join("");
  $("lost").innerHTML=LOST.map((n,i)=>`<div class="bar"><div class="row"><span>${L.reasons[i]}</span><span>${n}%</span></div><div class="track"><div class="fill" style="width:${n/LOST[0]*100}%;background:var(--navy)"></div></div></div>`).join("");
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  if(b.dataset.c){S.c=b.dataset.c;render();}
  if(b.dataset.lang){S.lang=b.dataset.lang;render();}
});
setInterval(render,60000);
render();

/* ---------- live Zoho CRM data ----------
   Runs only when the page is opened as a widget inside Zoho CRM.
   Reads Deals (Stage, Amount, Probability) and Leads; on any failure the sample figures stay. */
async function all(entity){
  let out=[],page=1;
  while(page<=5){
    const r=await ZOHO.CRM.API.getAllRecords({Entity:entity,per_page:200,page});
    if(!r||!r.data||!r.data.length)break;
    out=out.concat(r.data); if(!r.info||!r.info.more_records)break; page++;
  }
  return out;
}
async function loadLive(){
  try{
    const deals=await all("Deals"); if(!deals.length)return;
    let leads=0; try{leads=(await all("Leads")).length;}catch(_){}
    const isWon=s=>/won/i.test(s||""), isLost=s=>/lost|cancel/i.test(s||"");
    const open=deals.filter(d=>!isWon(d.Stage)&&!isLost(d.Stage)), won=deals.filter(d=>isWon(d.Stage)), lost=deals.filter(d=>isLost(d.Stage));
    const amt=d=>Number(d.Amount)||0, by={};
    open.forEach(d=>{const s=d.Stage||"Unstaged";(by[s]=by[s]||{name:s,n:0,v:0,p:0}); by[s].n++; by[s].v+=amt(d); by[s].p+=Number(d.Probability)||0;});
    const stages=Object.values(by).sort((a,b)=>a.p/a.n-b.p/b.n).slice(0,5);
    if(won.length)stages.push({name:T[S.lang].won,n:won.length,v:won.reduce((a,d)=>a+amt(d),0)});
    S.live={pipe:open.reduce((a,d)=>a+amt(d),0),weighted:open.reduce((a,d)=>a+amt(d)*(Number(d.Probability)||0)/100,0),
      win:won.length+lost.length?Math.round(won.length/(won.length+lost.length)*100):null,open:open.length,leads,stages};
    render();
  }catch(e){console.warn("Kanoo widget: live CRM data unavailable, showing sample data.",e);}
}
if(window.ZOHO&&ZOHO.embeddedApp){
  try{ZOHO.embeddedApp.on("PageLoad",loadLive);ZOHO.embeddedApp.init();}catch(e){}
}
</script>
